name: Validate bundle

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform-capabilities
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate (fails if generated sections are stale)
        run: python tools/dpc.py validate --check-generated
      - name: Self-tests
        run: python tools/test_dpc.py
      - name: Export
        run: python tools/dpc.py export
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: data-platform-capabilities/dist/
